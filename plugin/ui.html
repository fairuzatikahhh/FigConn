<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --fg: var(--figma-color-text, #1e1e1e);
    --fg2: var(--figma-color-text-secondary, #6b6b6b);
    --fg3: var(--figma-color-text-tertiary, #9a9a9a);
    --line: var(--figma-color-border, #e6e6e6);
    --ok: var(--figma-color-text-success, #14ae5c);
    --err: var(--figma-color-text-danger, #e03e1a);
    --run: var(--figma-color-text-brand, #0d99ff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 11px/16px Inter, system-ui, -apple-system, sans-serif; }
  .sec { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .sec:last-child { border-bottom: 0; }
  .row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--fg2); }
  .faint { color: var(--fg3); }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .label button { all: unset; cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--fg2); }
  .label button:hover { color: var(--fg); }

  /* header */
  .status { font-size: 12px; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); flex: none; align-self: center; }
  .dot.on { background: var(--ok); }
  .dot.busy { background: var(--run); }
  .file { margin-top: 4px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin-top: 6px; }
  .kv .k { color: var(--fg3); }

  /* sessions */
  #sessions { max-height: 168px; overflow-y: auto; margin: 0 -12px; padding: 0 12px; }
  .sess { padding: 5px 0; }
  .sess + .sess { border-top: 1px dashed var(--line); }
  .sess .name { font-weight: 600; }
  .state.run { color: var(--run); }
  .state.err { color: var(--err); }

  /* log */
  .log { max-height: 220px; overflow-y: auto; margin: 0 -12px; }
  .ent { display: grid; grid-template-columns: 50px 1fr auto; gap: 8px; padding: 3px 12px; align-items: center; }
  .ent:hover { background: var(--bg2); }
  .ent .t { color: var(--fg3); }
  .ent .d { color: var(--fg3); text-align: right; }
  .ent.err .c { color: var(--err); }
  .ent.run .c { color: var(--run); }
  .ent .msg { grid-column: 2 / 4; padding-left: 18px; color: var(--err); white-space: normal; word-break: break-word; }
  .empty { color: var(--fg3); padding: 2px 12px; }
  .ico { width: 12px; height: 12px; flex: none; display: inline-block; vertical-align: -2px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ent .s { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .ent.ok .s .ico { color: var(--ok); }
  .ent.err .s .ico { color: var(--err); }
  .ent.run .s .ico { color: var(--run); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sess .row .ico { color: var(--fg2); align-self: center; }
  .kv .k { display: flex; align-items: center; gap: 5px; }
  .help { color: var(--fg2); }
  .tog { all: unset; cursor: pointer; flex: none; align-self: center; height: 22px; padding: 0 6px; margin: -3px -6px -3px 4px; border-radius: 5px; border: 1px solid var(--line); display: flex; align-items: center; gap: 4px; color: var(--fg2); font-size: 10.5px; font-weight: 500; }
  .tog:hover { background: var(--bg2); color: var(--fg); }
  body.min .tog .txt { display: none; }
  .tog:focus-visible { outline: 1px solid var(--run); }
  body.min .hide-min { display: none; }
  body.min .sec:first-child { border-bottom: 0; padding: 8px 12px; }
  body.min .status { font-size: 11px; }
  .help code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10.5px; background: var(--bg2); padding: 0 3px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="sec">
    <div class="row"><span id="dot" class="dot"></span><span id="status" class="status grow ell">Looking for FigConn server</span><span id="counts" class="muted num"></span><button id="tog" class="tog" type="button" title="Minimize" aria-label="Minimize"></button></div>
    <div class="kv hide-min" id="file"></div>
  </div>

  <div class="sec hide-min">
    <div class="label"><span>Sessions</span></div>
    <div id="sessions"></div>
  </div>

  <div class="sec hide-min" id="logsec">
    <div class="label"><span>Activity</span><button id="clear" type="button">Clear</button></div>
    <div id="log" class="log"></div>
  </div>

<script>
  var PORT_START = 3911, PORT_END = 3920, LOG_MAX = 60;
  var sockets = {};     // port -> WebSocket (open or connecting)
  var servers = {};     // port -> server-info from that MCP server
  var stats = {};       // port -> { n, err, last, lastCmd, lastOk, running: {id: cmd} }
  var pending = {};     // request id -> { port, cmd, t0, entry }
  var log = [];         // newest first
  var info = null;      // current file info from the plugin
  var totals = { ok: 0, err: 0 };
  var minimized = false;

  // ---------- icons (inline SVG, stroke = currentColor) ----------
  var ICONS = {
    check:    '<path d="M3.5 8.5l3 3 6-7"/>',
    cross:    '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
    spinner:  '<path d="M8 2.5a5.5 5.5 0 1 1-5.5 5.5"/>',
    terminal: '<rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6.5l2 1.5-2 1.5M8.5 10h3"/>',
    window:   '<rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M1.5 5.5h13"/>',
    code:     '<path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/>',
    plug:     '<path d="M6 1.5v3M10 1.5v3M4 4.5h8v3a4 4 0 0 1-8 0zM8 11.5v3"/>',
    file:     '<path d="M4 1.5h5l3.5 3.5v9.5h-8.5zM9 1.5V5h3.5"/>',
    page:     '<rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M2.5 6h11"/>',
    cursor:   '<path d="M3 2.5l9.5 4-4 1.5-1.5 4z"/>',
    board:    '<rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M5 6h3M5 9h6"/>',
    minimize: '<path d="M3.5 8h9"/>',
    expand:   '<path d="M4 6.5l4 4 4-4"/>'
  };
  function icon(name) {
    var span = document.createElement('span');
    span.innerHTML = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">' + ICONS[name] + '</svg>';
    return span.firstChild;
  }
  function clientIcon(c) {
    var label = clientLabel(c);
    if (label === 'Claude Code') return 'terminal';
    if (label === 'Claude Desktop') return 'window';
    if (label === 'Cursor' || label === 'VS Code' || label === 'Windsurf') return 'code';
    return 'plug';
  }

  // ---------- helpers ----------
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function basename(p) { if (!p || p === '/') return ''; var parts = String(p).replace(/[\\/]+$/, '').split(/[\\/]/); return parts[parts.length - 1]; }
  function clientLabel(c) {
    if (!c || !c.name) return 'MCP client';
    var n = c.name.toLowerCase();
    if (n.indexOf('claude-code') >= 0) return 'Claude Code';
    if (n.indexOf('claude') >= 0) return 'Claude Desktop';
    if (n.indexOf('cursor') >= 0) return 'Cursor';
    if (n.indexOf('visual studio code') >= 0 || n.indexOf('vscode') >= 0) return 'VS Code';
    if (n.indexOf('windsurf') >= 0) return 'Windsurf';
    return c.name;
  }
  function ago(t) {
    if (!t) return '';
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function clock(t) { var d = new Date(t); function p(x) { return (x < 10 ? '0' : '') + x; } return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  function dur(ms) { return ms < 1000 ? ms + ' ms' : (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + ' s'; }
  function openPorts() { return Object.keys(sockets).filter(function (p) { return sockets[p].readyState === 1; }).sort(); }
  function st(port) { return stats[port] || (stats[port] = { n: 0, err: 0, last: 0, lastCmd: '', lastOk: true, running: {} }); }
  function sessionName(port) {
    var s = servers[port];
    if (!s) return 'Port ' + port;
    var proj = basename(s.cwd);
    return clientLabel(s.client) + (proj ? ' · ' + proj : '');
  }

  // ---------- render ----------
  function renderHeader() {
    var open = openPorts();
    var busy = Object.keys(pending).length > 0;
    document.getElementById('dot').className = 'dot' + (busy ? ' busy' : open.length ? ' on' : '');
    var running = log.filter(function (e) { return e.state === 'run'; });
    var status = !open.length ? (minimized ? 'Waiting for server' : 'Waiting for FigConn server')
      : busy ? (minimized && running.length ? running[0].cmd : 'Working')
      : minimized ? 'Connected' + (open.length > 1 ? ' · ' + open.length : '')
      : 'Connected to ' + open.length + (open.length === 1 ? ' session' : ' sessions');
    document.getElementById('status').textContent = status;
    document.getElementById('counts').textContent = (totals.ok + totals.err)
      ? (minimized ? (totals.err ? totals.err + ' failed' : totals.ok + ' ok') : (totals.ok + ' ok' + (totals.err ? ' · ' + totals.err + ' failed' : '')))
      : '';
    var tog = document.getElementById('tog');
    tog.innerHTML = '';
    tog.appendChild(icon(minimized ? 'expand' : 'minimize'));
    if (!minimized) tog.appendChild(el('span', 'txt', 'Minimize'));
    tog.title = tog.ariaLabel = minimized ? 'Expand' : 'Minimize';

    var f = document.getElementById('file');
    f.innerHTML = '';
    if (!info) return;
    function kv(ic, k, v, cls) {
      var key = el('span', 'k'); key.appendChild(icon(ic)); key.appendChild(document.createTextNode(k));
      f.appendChild(key); f.appendChild(el('span', 'ell' + (cls ? ' ' + cls : ''), v));
    }
    var figjam = info.editorType === 'figjam';
    kv(figjam ? 'board' : 'file', figjam ? 'Board' : 'File', info.fileName || 'Untitled');
    kv('page', 'Page', (info.currentPage && info.currentPage.name) || '');
    var n = (info.selection || []).length;
    kv('cursor', 'Selection', n ? n + (n === 1 ? ' layer · ' + info.selection[0] : ' layers') : 'Nothing selected', n ? 'mono' : 'faint');
  }

  function renderSessions() {
    var box = document.getElementById('sessions');
    var open = openPorts();
    box.innerHTML = '';
    if (!open.length) {
      var h = el('div', 'help');
      h.innerHTML = 'Start Claude Code or Claude Desktop with the FigConn MCP server. This window scans ports ' + PORT_START + '–' + PORT_END + ' every few seconds.';
      box.appendChild(h);
      return;
    }
    open.forEach(function (port) {
      var s = servers[port] || {};
      var x = st(port);
      var d = el('div', 'sess');
      var r1 = el('div', 'row');
      r1.appendChild(icon(clientIcon(s.client)));
      r1.appendChild(el('span', 'name grow ell', sessionName(port)));
      r1.appendChild(el('span', 'faint num', ':' + port));
      d.appendChild(r1);

      var running = Object.keys(x.running).map(function (k) { return x.running[k]; });
      var line;
      if (running.length) line = el('div', 'state run ell mono', 'running ' + running.join(', '));
      else if (x.last) line = el('div', 'state ell' + (x.lastOk ? ' muted' : ' err'), (x.lastOk ? '' : 'failed: ') + x.lastCmd + ' · ' + ago(x.last));
      else line = el('div', 'faint ell', 'Idle, no commands yet');
      d.appendChild(line);

      var meta = [];
      if (x.n) meta.push(x.n + (x.n === 1 ? ' command' : ' commands') + (x.err ? ', ' + x.err + ' failed' : ''));
      if (s.startedAt) meta.push('up ' + ago(s.startedAt).replace(' ago', ''));
      if (s.pid) meta.push('pid ' + s.pid);
      if (meta.length) d.appendChild(el('div', 'faint ell num', meta.join(' · ')));
      d.title = [s.cwd && s.cwd !== '/' ? s.cwd : '', s.client ? s.client.name + ' ' + (s.client.version || '') : ''].filter(Boolean).join('\n');
      box.appendChild(d);
    });
  }

  function renderLog() {
    var box = document.getElementById('log');
    box.innerHTML = '';
    if (!log.length) { box.appendChild(el('div', 'empty', 'Commands from Claude will appear here.')); return; }
    var multi = openPorts().length > 1;
    log.forEach(function (e) {
      var row = el('div', 'ent ' + e.state);
      row.appendChild(el('span', 't num', clock(e.t0)));
      var cell = el('span', 's');
      cell.appendChild(icon(e.state === 'ok' ? 'check' : e.state === 'err' ? 'cross' : 'spinner'));
      var c = el('span', 'c ell mono', e.cmd + (multi ? '  ' : ''));
      if (multi) { var s = servers[e.port]; c.appendChild(el('span', 'faint', clientLabel(s && s.client).replace(/^Claude /, ''))); }
      cell.appendChild(c);
      row.appendChild(cell);
      row.appendChild(el('span', 'd num', e.state === 'run' ? 'running' : dur(e.ms)));
      if (e.error) row.appendChild(el('div', 'msg', e.error));
      box.appendChild(row);
    });
  }

  function render() { renderHeader(); renderSessions(); renderLog(); fit(); }

  var lastH = 0, lastW = 0;
  function fit() {
    var w = minimized ? 200 : 300;
    var h = document.body.scrollHeight;
    if (w !== lastW || Math.abs(h - lastH) > 1) { lastW = w; lastH = h; parent.postMessage({ pluginMessage: { type: 'resize', width: w, height: h } }, '*'); }
  }

  function setMinimized(v, persist) {
    minimized = !!v;
    document.body.classList.toggle('min', minimized);
    render();
    if (persist) parent.postMessage({ pluginMessage: { type: 'set-minimized', minimized: minimized } }, '*');
  }

  // ---------- sockets ----------
  function send(ws, obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  function broadcast(obj) { Object.keys(sockets).forEach(function (p) { send(sockets[p], obj); }); }

  function connect(port) {
    if (sockets[port]) return;
    var ws;
    try { ws = new WebSocket('ws://localhost:' + port); } catch (e) { return; }
    sockets[port] = ws;
    ws.onopen = function () { if (info) send(ws, { type: 'hello', info: info }); render(); };
    ws.onclose = function () {
      if (sockets[port] !== ws) return;
      delete sockets[port]; delete servers[port];
      Object.keys(pending).forEach(function (id) {
        var p = pending[id];
        if (p.port === port) { p.entry.state = 'err'; p.entry.error = 'Server disconnected'; p.entry.ms = Date.now() - p.t0; delete pending[id]; }
      });
      delete stats[port];
      render();
    };
    ws.onerror = function () {};
    ws.onmessage = function (ev) {
      var msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'server-info') { servers[port] = msg.info || {}; render(); return; }
      if (msg.type === 'request') {
        var entry = { id: msg.id, port: port, cmd: msg.cmd, t0: Date.now(), state: 'run' };
        log.unshift(entry); if (log.length > LOG_MAX) log.length = LOG_MAX;
        pending[msg.id] = { port: port, cmd: msg.cmd, t0: entry.t0, entry: entry };
        st(port).running[msg.id] = msg.cmd;
        render();
        msg.port = port;
        parent.postMessage({ pluginMessage: msg }, '*');
      }
    };
  }

  function scan() { for (var p = PORT_START; p <= PORT_END; p++) connect(String(p)); }

  window.onmessage = function (ev) {
    var msg = ev.data && ev.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'prefs') { setMinimized(msg.minimized, false); }
    else if (msg.type === 'info') { info = msg.info; broadcast({ type: 'hello', info: info }); render(); }
    else if (msg.type === 'active') { info = msg.info || info; broadcast({ type: 'active', info: info }); render(); }
    else if (msg.type === 'response') {
      var port = String(msg.port); delete msg.port;
      send(sockets[port], msg);
      var p = pending[msg.id];
      if (p) {
        delete pending[msg.id];
        var x = st(port);
        delete x.running[msg.id];
        x.n++; x.last = Date.now(); x.lastCmd = p.cmd; x.lastOk = !!msg.ok;
        if (!msg.ok) x.err++;
        msg.ok ? totals.ok++ : totals.err++;
        p.entry.state = msg.ok ? 'ok' : 'err';
        p.entry.ms = Date.now() - p.t0;
        if (!msg.ok) p.entry.error = msg.error || 'Unknown error';
      }
      render();
    }
  };

  document.getElementById('clear').onclick = function () {
    log = log.filter(function (e) { return e.state === 'run'; });
    totals = { ok: 0, err: 0 };
    render();
  };

  document.getElementById('tog').onclick = function () { setMinimized(!minimized, true); };

  scan();
  setInterval(scan, 3000);
  setInterval(function () { renderSessions(); fit(); }, 15000); // keep "x ago" fresh
  render();
</script>
</body>
</html>
